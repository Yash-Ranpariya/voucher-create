openapi: 3.0.0
info:
  title: Expense Voucher API
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
paths:
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
  /vouchers:
    get:
      summary: List vouchers (scoped by role)
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: List of vouchers
    post:
      summary: Create Draft Voucher (Employee only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expense_date:
                  type: string
                  format: date-time
                amount:
                  type: number
                title:
                  type: string
                department:
                  type: string
                category:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Draft created
  /vouchers/{id}/submit:
    post:
      summary: Submit Draft (Employee only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submitted successfully
  /vouchers/{id}/approve:
    post:
      summary: Approve Voucher (Director only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                signature:
                  type: string
                  format: binary
      responses:
        '200':
          description: Approved successfully
  /vouchers/{id}/reject:
    post:
      summary: Reject Voucher (Director only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected successfully
